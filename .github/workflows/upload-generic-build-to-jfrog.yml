name: Upload Generic Build to JFrog Artifactory

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build artifact
        run: |
          set -e
          mkdir -p build
          echo "Build from GitHub Actions" > build/app.txt
          zip -r app-build.zip build README.md
          ls -l app-build.zip

      - name: Test JFrog connectivity
        run: |
          set -e
          echo "Testing connection to JFrog..."
          curl -v --connect-timeout 10 "${{ secrets.JF_URL }}"

      - name: Upload artifact to JFrog Generic Repository
        run: |
          set -e
          echo "Uploading artifact to JFrog..."
          curl -v -u "${{ secrets.JF_USER }}:${{ secrets.JF_TOKEN }}" \
            -T app-build.zip \
            "${{ secrets.JF_URL }}/generic-local/github-actions/app-build-${{ github.run_number }}.zip"

      - name: Confirm upload
        run: |
          echo "Upload completed successfully!"
